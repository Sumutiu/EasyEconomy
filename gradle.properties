# Done to increase the memory available to gradle (both loaders decompile Minecraft).
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.configuration-cache=false

# Mod Properties
mod_version=1.2.2
maven_group=com.sumutiu.easyeconomy
mod_id=easyeconomy
java_version=25

# Minecraft
minecraft_version=26.3
# The Minecraft versions the NeoForge jar accepts (fabric.mod.json uses ~${minecraft_version})
minecraft_version_range=[26.3,26.4)
# Plain Minecraft for the common project, check these on https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Fabric Properties
# check these on https://fabricmc.net/develop
loader_version=0.19.5
loom_version=1.18-SNAPSHOT
fabric_api_version=0.162.0+26.3
# Placeholder API, bundled in the Fabric jar
placeholder_api_version=3.2.0+26.3

# NeoForge Properties
# check these on https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.3.0.58-beta
neoforge_loader_version_range=[4,)
moddev_version=2.0.148
# Placeholder API NeoForge (unofficial port of Placeholder API), bundled in the NeoForge jar
# check these on https://modrinth.com/mod/placeholder-api-neoforge/versions
placeholder_api_neoforge_version=3.2.0+26.3+neoforge
